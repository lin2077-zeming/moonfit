name: CI

env:
  MOONBIT_VERSION: 0.10.20+65efd5b93

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # core-version must be pinned alongside the toolchain. The action
      # defaults it to `latest`, and a core newer than the pinned moon emits a
      # deprecation warning inside the generated test driver (size_hint= was
      # renamed to capacity=), which --deny-warn then turns into a build
      # failure that has nothing to do with this repository.
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonCakes registry and dependencies
        run: moon update

      # ------------------------------------------------------------------
      # Gate 0: corpus integrity. Runs before anything else because every
      # other gate depends on the committed .fit files still being the exact
      # bytes the device produced. If Git ever normalises a .fit as text this
      # fails loudly instead of silently invalidating the G2 round-trip gate.
      # ------------------------------------------------------------------
      - name: Verify corpus bytes are unmodified (Gate 0)
        run: |
          python3 scripts/check_corpus_integrity.py --self-test
          python3 scripts/check_corpus_integrity.py

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      # ------------------------------------------------------------------
      # Gate G7 runs first among the test gates. The unit conversion layer is
      # the ruler every other measurement depends on; if it is wrong then a
      # green G2..G8 run means nothing.
      # ------------------------------------------------------------------
      - name: Gate G7 - unit conversion constants (native)
        run: moon test src/units --target native --deny-warn

      - name: Build all supported targets
        run: moon build --target all --release --deny-warn

      - name: Bundle all supported targets
        run: moon bundle --all --release --deny-warn

      - name: Build native CLI
        run: moon build cmd/moonfit --target native --release --deny-warn

      - name: Install fitparse + geographiclib (G3/G4 reference)
        run: python3 -m pip install --quiet fitparse geographiclib

      - name: Gate G3 - differential decode vs fitparse
        run: |
          python3 scripts/check_g3.py --self-test
          python3 scripts/check_g3.py

      - name: Gate G2 - byte-exact round trip over corpus
        run: |
          python3 scripts/check_g2.py --self-test
          python3 scripts/check_g2.py

      - name: Gate G4 - derived metrics vs independent reference
        run: |
          python3 scripts/check_g4.py --self-test
          python3 scripts/check_g4.py

      - name: TCX decode vs independent XML parse
        run: |
          python3 scripts/check_tcx.py --self-test
          python3 scripts/check_tcx.py

      - name: Gate G5 - FIT/TCX divergence vs independent reference
        run: |
          python3 scripts/check_g5.py --self-test
          python3 scripts/check_g5.py

      - name: Redaction idempotence + trim gate
        run: |
          python3 scripts/check_redact.py --self-test
          python3 scripts/check_redact.py

      - name: Gate G6 - robustness / mutation rejection
        run: |
          python3 scripts/check_g6.py --self-test
          python3 scripts/check_g6.py

      - name: Gate G8 - per-field disposition coverage
        run: |
          python3 scripts/check_g8.py --self-test
          python3 scripts/check_g8.py
      - name: JSON output safety gate
        run: |
          python3 scripts/check_json.py --self-test
          python3 scripts/check_json.py

      - name: Test native target
        run: moon test --target native --deny-warn

      - name: Test wasm target
        run: moon test --target wasm --deny-warn

      - name: Test wasm-gc target
        run: moon test --target wasm-gc --deny-warn

      - name: Test js target
        run: moon test --target js --deny-warn

      - name: Verify generated interfaces are up to date
        run: |
          moon info
          git diff --exit-code

      - name: Verify declared scope matches implementation
        run: |
          python3 scripts/check_boundaries.py --self-test
          python3 scripts/check_boundaries.py

      - name: Verify docs make no undelivered or unmeasurable promises
        run: |
          python3 scripts/check_docs.py --self-test
          python3 scripts/check_docs.py

      - name: Verify runtime dependencies are attributed
        run: |
          python3 scripts/check_notices.py --self-test
          python3 scripts/check_notices.py

      - name: Smoke-test CLI exit codes
        run: |
          python3 scripts/smoke_cli.py --self-test
          python3 scripts/smoke_cli.py

      # Informational only, NOT a gate: coverage is reported but never enforced,
      # so `|| true` is intentional. Do not describe this as a "coverage gate".
      - name: Report uncovered lines (informational, not a gate)
        run: moon coverage analyze > uncovered.log || true
